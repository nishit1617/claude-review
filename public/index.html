<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Review</title>
<style>
  :root {
    --bg: #FFFFFF; --card: #FFFFFF; --card2: #F1F0FB;
    --line: #E2E4E0; --ink: #22272D; --muted: #67707B; --hunkbar: #F6F7F6;
    --accent: #0E7569; --accent-ink: #FFFFFF;
    --add-bg: #E9F5EE; --add-fg: #1A7F37;
    --del-bg: #FBEDEA; --del-fg: #C0402A;
    --warn: #9A6700; --warn-bg: #FFF3CD; --warn-fg: #9A6700;
    --blue-bg: #E6F1FB; --blue-fg: #185FA5;
    --purple-bg: #EEEDFE; --purple-fg: #534AB7;
    --shadow: 0 1px 2px rgba(30,35,40,.05), 0 4px 14px rgba(30,35,40,.04);
    --menu-shadow: 0 8px 24px rgba(20,25,30,.12), 0 2px 10px rgba(20,25,30,.07);
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: "Segoe UI", -apple-system, Roboto, "Helvetica Neue", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #14181D; --card: #1B222A; --card2: #222A33;
    --line: #2C353F; --ink: #E4EAF0; --muted: #8A94A0; --hunkbar: #222A33;
    --accent: #3CBDAD; --accent-ink: #0E1A18;
    --add-bg: #16301F; --add-fg: #66D08D;
    --del-bg: #34201F; --del-fg: #F0937D;
    --warn: #D9A94A; --warn-bg: #2E2410; --warn-fg: #D9A94A;
    --blue-bg: #16283A; --blue-fg: #6DA9E8;
    --purple-bg: #241F3D; --purple-fg: #A79CEE;
    --shadow: none;
    --menu-shadow: 0 8px 24px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 var(--sans); transition: background .2s, color .2s;
    min-height: 100vh; display: flex; flex-direction: column; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    gap: 14px; padding: 12px 24px 10px; background: var(--card);
    border-bottom: 1px solid var(--line); box-shadow: var(--shadow); flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  header h1 .ver { font-size: 11px; color: var(--muted); font-weight: 400;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
  header .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  /* Native button chrome bakes in its own hidden padding, so relying on
     author padding alone leaves icon-only/flex buttons (theme, the mode
     dropdown) a different height than plain text buttons. Fixing the
     height directly makes every header button identical regardless of
     content. */
  header button { height: 34px; }
  .btn-accept { color: var(--add-fg); border-color: color-mix(in srgb, var(--add-fg) 35%, var(--line)); }
  .btn-accept:hover, .btn-accept:focus-visible { background: var(--add-bg); border-color: var(--add-fg); }
  .btn-reject { color: var(--del-fg); border-color: color-mix(in srgb, var(--del-fg) 35%, var(--line)); }
  .btn-reject:hover, .btn-reject:focus-visible { background: var(--del-bg); border-color: var(--del-fg); }
  .btn-viewed { color: var(--blue-fg); border-color: color-mix(in srgb, var(--blue-fg) 35%, var(--line)); }
  .btn-viewed:hover, .btn-viewed:focus-visible { background: var(--blue-bg); border-color: var(--blue-fg); }
  .viewed-toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 13px; color: var(--blue-fg); border: 1px solid color-mix(in srgb, var(--blue-fg) 35%, var(--line));
    border-radius: 8px; padding: 6px 14px; }
  .viewed-toggle:hover { background: var(--blue-bg); border-color: var(--blue-fg); }
  .viewed-toggle input { width: 15px; height: 15px; margin: 0; accent-color: var(--blue-fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:disabled { opacity: .45; cursor: default; }
  .confirm-overlay { position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .confirm-overlay.hidden { display: none; }
  .confirm-modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--menu-shadow); padding: 28px; width: 480px; max-width: calc(100vw - 32px); }
  .confirm-modal h2 { margin: 0 0 18px; font-size: 17px; font-weight: 600; }
  .confirm-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
  .cs-tile { background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 6px; text-align: center; min-width: 0; box-sizing: border-box; }
  .cs-tile .cs-num { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .cs-tile .cs-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 480px) {
    .confirm-modal { padding: 20px 16px 18px; }
    .confirm-summary { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  }
  .cs-tile.cs-files .cs-num { color: var(--blue-fg); }
  .cs-tile.cs-accepted .cs-num { color: var(--add-fg); }
  .cs-tile.cs-partial .cs-num { color: var(--warn-fg); }
  .cs-tile.cs-rejected .cs-num { color: var(--del-fg); }
  .confirm-msg { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 18px; }
  .confirm-msg strong { color: var(--ink); }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-actions button { min-width: 90px; }
  #theme { padding: 6px 10px; line-height: 0; display: inline-flex; align-items: center; }
  #theme svg { transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s; }
  #theme.switching svg { transform: rotate(180deg) scale(0); opacity: 0; }
  /* View Transitions — disable default cross-fade so JS clip-path animation takes over */
  ::view-transition-old(root),
  ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { z-index: 999; }
  /* Fallback: broad CSS transitions when View Transitions API is unavailable */
  .theme-transition *, .theme-transition *::before, .theme-transition *::after {
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease !important; }
  .mode-seg { display: inline-flex; align-items: stretch; background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px;
    height: 34px; box-sizing: border-box; }
  .mode-seg .mode-seg-btn { height: 100%; padding: 0 14px; font: inherit; font-size: 13px;
    font-weight: 500; color: var(--muted); background: transparent; border: none;
    border-radius: 7px; cursor: pointer; transition: background .15s, color .15s, box-shadow .15s; }
  .mode-seg .mode-seg-btn.active { background: var(--card); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.10), 0 0 0 1px var(--line); }
  [data-theme="dark"] .mode-seg .mode-seg-btn.active { background: #323D4D; color: #FFFFFF;
    box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 0 0 1px #48566A; }
  .mode-seg .mode-seg-btn:hover:not(.active) { color: var(--ink); }
  #main { transition: opacity .15s ease; }
  #main.mode-loading { opacity: 0.4; pointer-events: none; }
  #main.mode-switching { opacity: 0; pointer-events: none; }
  .wrap { padding: 24px; width: 100%; box-sizing: border-box;
    flex: 1; display: flex; flex-direction: column; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow); }
  .stat .num { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .stat .lbl { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stat .badge { width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; }
  .stat.files .badge { background: var(--blue-bg); color: var(--blue-fg); }
  .stat.changes .badge { background: var(--purple-bg); color: var(--purple-fg); }
  .stat.accepted .num { color: var(--add-fg); } .stat.accepted .badge { background: var(--add-bg); color: var(--add-fg); }
  .stat.partial .num { color: var(--warn-fg); } .stat.partial .badge { background: var(--warn-bg); color: var(--warn-fg); }
  .stat.rejected .num { color: var(--del-fg); } .stat.rejected .badge { background: var(--del-bg); color: var(--del-fg); }
  .layout { display: flex; align-items: stretch; flex: 1; }
  .sidebar { flex-shrink: 0; width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden; position: sticky; top: 90px;
    display: flex; flex-direction: column; max-height: calc(100vh - 110px); }
  .resize-handle { flex-shrink: 0; width: 20px; display: flex; align-items: center; justify-content: center;
    cursor: col-resize; position: relative; }
  .resize-handle::after { content: ''; width: 2px; height: 48px; background: var(--line);
    border-radius: 2px; transition: background .15s, height .15s; }
  .resize-handle:hover::after, .resize-handle.dragging::after { background: var(--accent); height: 64px; }
  .resize-handle .rh-dots { position: absolute; display: flex; flex-direction: column; gap: 4px;
    opacity: 0; transition: opacity .15s; pointer-events: none; }
  .resize-handle:hover .rh-dots, .resize-handle.dragging .rh-dots { opacity: 1; }
  .resize-handle .rh-dots span { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); display: block; }
  .sfile-list { flex: 1; overflow-y: auto; }
  .sidebar-head { padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .sidebar-head .sf-title { font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: .04em; text-transform: uppercase; }
  .sf-tools { display: flex; align-items: center; gap: 8px; }
  .sf-search { position: relative; flex: 1; display: flex; align-items: center; }
  .sf-search-icon { position: absolute; left: 9px; display: flex; color: var(--muted); pointer-events: none; }
  .sf-search input { width: 100%; box-sizing: border-box; height: 34px; padding: 0 26px 0 30px;
    font: inherit; font-size: 13px; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; outline: none; }
  .sf-search input:focus { border-color: var(--accent); }
  .sf-search input::placeholder { color: var(--muted); }
  .sf-clear { position: absolute; right: 4px; padding: 3px; line-height: 0; border: 0;
    background: none; color: var(--muted); cursor: pointer; border-radius: 6px; }
  .sf-clear:hover { background: var(--line); color: inherit; }
  .filter-dd { position: relative; flex-shrink: 0; }
  .filter-dd-btn { display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; width: 34px; height: 34px; padding: 0; line-height: 0; color: var(--muted); }
  .filter-dd-btn:hover { color: inherit; }
  .filter-dd-btn.active { background: var(--blue-bg); border-color: var(--blue-fg); color: var(--blue-fg); }
  .filter-dd-menu { position: absolute; top: calc(100% + 6px); right: 0; width: 170px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--menu-shadow); padding: 6px; z-index: 30;
    opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none;
    transition: opacity .14s ease, transform .14s ease; }
  .filter-dd-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .filter-dd-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px; }
  .filter-dd-item:hover, .filter-dd-item:focus { background: var(--card2); outline: none; }
  .filter-dd-item .fdi-check { display: flex; color: var(--accent); flex-shrink: 0; visibility: hidden; }
  .filter-dd-item.selected .fdi-check { visibility: visible; }
  .filter-dd-item.selected .fdi-label { color: var(--accent); font-weight: 600; }
  .sfile-empty { padding: 18px 16px; font-size: 13px; color: var(--muted); text-align: center; }
  .sfile { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line); }
  .sfile:last-child { border-bottom: 0; }
  .sfile:hover { background: var(--card2); }
  .sfile.current { background: var(--add-bg); }
  .sfile-icon { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; }
  .sfile-icon.viewed { background: var(--add-fg); color: #fff; }
  .sfile-icon.pending { border: 1.5px solid var(--line); }
  .sfile-info { min-width: 0; }
  .sfile-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sfile-dir { font-size: 11.5px; color: var(--muted); font-family: var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden; }
  @keyframes crSlideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes crSlideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-24px); } }
  .detail.slide-in { animation: crSlideIn .22s ease-out; }
  .detail.slide-out { animation: crSlideOut .18s ease-in; }
  .dhead { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    border-bottom: 1px solid var(--line); }
  .dhead .ficon { width: 36px; height: 36px; border-radius: 8px; background: var(--blue-bg);
    color: var(--blue-fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dhead .fmeta { flex: 1; min-width: 0; }
  .dhead .fname { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dhead .fdir { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .dhead .copy-path { display: flex; align-items: center; justify-content: center;
    padding: 0; width: 34px; height: 34px; background: none; border: none;
    color: var(--muted); border-radius: 6px; flex-shrink: 0; }
  .dhead .copy-path:hover { background: var(--bg); color: var(--ink); }
  .dstats { display: flex; align-items: center; gap: 20px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
  .dstats .plus { color: var(--add-fg); } .dstats .minus { color: var(--del-fg); }
  .dstats .fileacts { margin-left: auto; display: flex; gap: 6px; }
  .hunk { border-bottom: 1px solid var(--line); }
  @keyframes crPulse { 0% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 0px transparent; } }
  .hunk.pulse { animation: crPulse .5s ease-out; }
  .hunk:last-child { border-bottom: 0; }
  .hunkbar { display: flex; align-items: center; gap: 10px; padding: 8px 20px;
    font-size: 13px; color: var(--muted); background: var(--hunkbar); }
  .hunk-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer;
    user-select: none; border-radius: 6px; }
  .hunk-chev { display: flex; color: var(--muted); transition: transform .15s ease;
    transform: rotate(180deg); }
  .hunk.collapsed .hunk-chev { transform: rotate(0deg); }
  .hunk-title { font-weight: 600; color: var(--ink); }
  .hunk-range { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .hunkbar .acts { margin-left: auto; display: flex; gap: 6px; }
  .hunkbar button { padding: 3px 12px; font-size: 12px; border-radius: 6px; }
  .hunk.accepted .hunkbar .st { color: var(--accent); }
  .hunk.rejected .hunk-range, .hunk.rejected .hunkbar .st { color: var(--del-fg); }
  .hunk.partial .hunk-range, .hunk.partial .hunkbar .st { color: var(--warn); }
  .hunk.rejected pre { opacity: .6; }
  .hunk.collapsed pre, .hunk.collapsed .reason { display: none; }
  pre { margin: 0; padding: 4px 0; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.65; }
  pre .l { display: flex; min-width: 100%; }
  pre .l .gutter { flex-shrink: 0; width: 74px; display: flex; user-select: none;
    color: var(--muted); opacity: .7; }
  pre .l .gutter span { flex: 1; text-align: right; padding-right: 8px; }
  pre .l .txt { padding: 0 16px; white-space: pre-wrap; overflow-wrap: break-word; min-width: 0; flex: 1; }
  pre .a { background: var(--add-bg); color: var(--add-fg); }
  pre .d { background: var(--del-bg); color: var(--del-fg); }
  pre .c { color: var(--muted); }
  pre .a .txt, pre .d .txt { cursor: pointer; }
  pre .a:hover .txt, pre .d:hover .txt { outline: 1px solid var(--muted); outline-offset: -1px; }
  pre .rej .txt { text-decoration: line-through; opacity: .55; }
  pre .rej .txt::after { content: ' \21a9 reverting'; text-decoration: none; opacity: .9;
    font-size: 11px; color: var(--del-fg); }
  pre .restoring .txt { opacity: 1; }
  pre .restoring .txt::after { content: ' \21a9 restoring'; text-decoration: none; opacity: .9;
    font-size: 11px; color: var(--add-fg); }
  .seg { position: relative; border-left: 2px solid var(--line); }
  .seg:hover { border-left-color: var(--accent); }
  .segbar { position: absolute; right: 8px; top: 2px; display: none; gap: 4px; z-index: 2; }
  .seg:hover .segbar { display: flex; }
  .segbar button { padding: 1px 8px; font-size: 11px; border-radius: 5px; background: var(--card); }
  .reason { padding: 8px 20px 12px; }
  .reason-row { position: relative; }
  .reason-row input { width: 100%; padding-right: 38px; font: 13px var(--mono); color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding-top: 7px; padding-bottom: 7px; padding-left: 10px; box-sizing: border-box; }
  .reason-row input::placeholder { color: var(--muted); }
  .reason-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .reason-submit { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; padding: 0; border-radius: 50%; border: none;
    background: var(--add-fg); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; }
  .reason-submit:hover:not(:disabled) { opacity: .85; }
  .reason-submit:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .reason-view { display: flex; align-items: center; gap: 8px; font: 13px var(--mono); color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .reason-view .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason-view button { padding: 2px 8px; font-size: 12px; border-radius: 6px; flex-shrink: 0; }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; }
  .done { text-align: center; padding: 80px 24px; }
  .done h2 { font-weight: 600; }
  .done .fail { color: var(--del-fg); font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Claude Review<span class="ver">v__CR_VERSION__</span></h1>
  <span class="spacer"></span>
  <button id="theme" title="Switch light / dark" aria-label="Switch light / dark"></button>
  <div class="mode-seg" role="group" aria-label="Review mode">
    <button type="button" class="mode-seg-btn" data-value="per-request">This turn</button>
    <button type="button" class="mode-seg-btn" data-value="accumulate">All changes</button>
  </div>
  <button id="acceptAll" class="btn-accept">&#10003; Accept All</button>
  <button id="rejectAll" class="btn-reject">&#10007; Reject All</button>
  <button class="primary" id="submit">Apply Review</button>
</header>
<div class="wrap" id="main"><div class="empty">Loading changes…</div></div>
<div class="confirm-overlay hidden" id="confirmOverlay">
  <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">Apply Review</h2>
    <div class="confirm-summary" id="confirmSummary"></div>
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-actions">
      <button id="confirmCancel">Cancel</button>
      <button class="primary" id="confirmOk">Apply</button>
    </div>
  </div>
</div>
<script>
// Theme: light by default, remembers your choice, follows OS preference first time
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem('cr-theme'); } catch (_) {}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
const ICON_MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

// 'pagehide' event a real tab close does — from the browser's

// the server the tab is gone, when it's actually back within a
// fraction of a second. That falsely-cleared state is exactly what
// let a duplicate tab open during what should have been a seamless
// self-upgrade.

document.getElementById('theme').onclick = (e) => {

    const transition = document.startViewTransition(() => {
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('cr-theme', next); } catch (_) {}

let model = null;
let currentFileIndex = 0;
let sidebarW = 300;
const viewedFiles = new Set(); // filePath -> viewed, persists across re-renders (e.g. live refresh)
let fileSearch = '';   // sidebar search text, persists across sidebar rebuilds
let fileFilter = 'all'; // sidebar status filter: all | accepted | partial | rejected | viewed | unviewed
const collapsedHunks = new Set(); // hunkId -> collapsed; reapplied by paintHunk since it rewrites .hunk's className
const lineRej = {};  // hunkId -> Set of rejected line indices (into hunk.lines)
const reasons = {};  // hunkId -> string
const reasonConfirmed = {}; // hunkId -> bool, true once Enter has "submitted" the reason
const changedIdx = {}; // hunkId -> array of indices of +/- lines

const CR_VERSION = document.querySelector('header h1 .ver').textContent.replace('v','');
let pollTimer = null;
let currentSig = null;
async function startPolling() {
  const first = await fetch('/api/sig').then(r => r.json()).catch(() => null);
  if (first) {
    currentSig = first.sig;
    if (first.mode) paintMode(first.mode);
  }
  pollTimer = setInterval(pollOnce, 1000);
  // Browsers throttle setInterval in background tabs, which can leave
  // the server's "is anyone viewing this?" check stale. Firing an
  // immediate poll the moment the tab becomes visible again keeps
  // that fresh without waiting on the throttled timer.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pollOnce();
  });
}

async function pollOnce() {
  try {
    const { sig, version, mode } = await fetch('/api/sig').then(r => r.json());
    if (version && version !== CR_VERSION) {
      // This tab is running JS from an older plugin version — the
      // server has already moved on. Do the one hard reload needed
      // to pick up current code; every update after this is silent.
      clearInterval(pollTimer);
      window.__crReload();
      return;
    }
    if (currentSig && sig !== currentSig && sig !== 'none') {
      currentSig = sig;
      await refresh();
    } else if (currentSig === null) {
      currentSig = sig;
    }
    // Mode rides the same 1s poll as the diff, so a change made in
    // another tab (or by hand-editing config.json) shows up here live
    // too, instead of only being picked up once at page load. Skipped
    // while the menu is open so a poll can't yank the selection out
    // from under someone mid-click.
    if (mode && mode !== currentMode) {
      paintMode(mode);
      await refresh();
    }
  } catch (_) {}
}

// Silent in-place update: re-fetch the review and re-render, with no
// navigation and no flash.
async function refresh() {
  const data = await fetchReview();
  applyReview(data);
  toast('Updated with the latest changes');
}

async function fetchReview() {
  const res = await fetch('/api/review');
  return res.json();
}

function applyReview(data) {
  model = data;
  if (model.error || !model.files || !model.files.length) {
    document.getElementById('main').innerHTML = '<div class="empty">No changes to review.</div>';
    return;
  }
  for (const k in lineRej) delete lineRej[k];
  for (const k in changedIdx) delete changedIdx[k];
  for (const k in reasons) delete reasons[k];
  for (const k in reasonConfirmed) delete reasonConfirmed[k];
  for (const f of model.files) for (const h of f.hunks) {
    lineRej[h.id] = new Set();
    changedIdx[h.id] = h.lines.map((l,i)=>[l,i]).filter(([l])=>l[0]==='+'||l[0]==='-').map(([,i])=>i);
  }
  if (currentFileIndex >= model.files.length) currentFileIndex = 0;
  renderAll();
}

function toast(msg) {

    t = el('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);'
      + 'background:var(--ink);color:var(--card);font-size:13px;padding:8px 16px;'
      + 'border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;z-index:20;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; }, 2200);

// Custom dropdown (not a native <select>) so each option can carry an
const modeSegBtns = [...document.querySelectorAll('.mode-seg-btn')];
let currentMode = 'per-request';

function paintMode(mode) {
  currentMode = mode;

document.addEventListener('click', (e) => {

for (const btn of modeSegBtns) {
  btn.onclick = () => selectMode(btn.dataset.value);

async function selectMode(mode) {
  if (mode === currentMode) return;
  const prev = currentMode;
  paintMode(mode);
  const main = document.getElementById('main');
  // Phase 1: dim the old content while the server recomputes the diff.
  // The user can still see what was there — no white blank.
  main.classList.add('mode-loading');
  try {
    const res = await fetch('/api/mode', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    });
    if (!res.ok) throw new Error();
    const data = await fetchReview(); // fetch new data while old content is still (dimly) visible
    // Phase 2: quick swap now that data is ready — only invisible for ~150ms.
    main.classList.remove('mode-loading');
    main.classList.add('mode-switching');
    await new Promise(r => setTimeout(r, 150));
    applyReview(data);
    requestAnimationFrame(() => main.classList.remove('mode-switching'));
    toast(mode === 'accumulate' ? 'Now showing every uncommitted change in the project' : 'Now showing only the latest prompt\'s changes');
  } catch (_) {
    main.classList.remove('mode-loading', 'mode-switching');
    paintMode(prev);
    toast("Couldn't save mode — try again");
  }
}

async function loadMode() {
  try {
    const { mode } = await fetch('/api/mode').then(r => r.json());
    paintMode(mode);
  } catch (_) {}
}

async function load() {
  await loadMode();
  startPolling();
  const res = await fetch('/api/review');
  model = await res.json();
  const main = document.getElementById('main');
  if (model.error) { main.innerHTML = '<div class="empty">' + esc(model.error) + '</div>'; return; }
  if (!model.files.length) { main.innerHTML = '<div class="empty">No changes to review.</div>'; return; }
  for (const f of model.files) for (const h of f.hunks) {
    lineRej[h.id] = new Set();
    changedIdx[h.id] = h.lines.map((l,i)=>[l,i]).filter(([l])=>l[0]==='+'||l[0]==='-').map(([,i])=>i);
  }
  renderAll();
}

function splitPath(filePath) {
  const idx = filePath.lastIndexOf('/');
  return idx === -1 ? { name: filePath, dir: '' } : { name: filePath.slice(idx + 1), dir: filePath.slice(0, idx) };
}

function makeResizeHandle() {
  const handle = el('div', 'resize-handle');
  const dots = el('div', 'rh-dots');
  dots.append(el('span', ''), el('span', ''), el('span', ''));
  handle.appendChild(dots);
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    const sidebar = handle.closest('.layout').querySelector('.sidebar');
    const startX = e.clientX, startW = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cssText += ';cursor:col-resize!important;user-select:none!important';
    const onMove = e => {
      const w = Math.max(180, Math.min(600, startW + e.clientX - startX));
      sidebar.style.width = w + 'px';
      sidebarW = w;
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  return handle;
}

function renderAll() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(buildStats());
  const layout = el('div', 'layout');
  layout.appendChild(buildSidebar());
  layout.appendChild(makeResizeHandle());
  layout.appendChild(buildDetail(model.files[currentFileIndex]));
  main.appendChild(layout);
  for (const h of model.files[currentFileIndex].hunks) paintHunk(h);
  tally();
}

function buildStats() {
  const wrap = el('div', 'stats');
  let changes = 0, accepted = 0, partial = 0, rejected = 0;
  for (const f of model.files) for (const h of f.hunks) {
    changes++;
    const s = lineRej[h.id].size, total = changedIdx[h.id].length;
    if (s === total && total > 0) rejected++;
    else if (s === 0) accepted++;
    else partial++;
  }
  const tiles = [
    ['files', ICON_FILE, model.files.length, 'Files'],
    ['changes', ICON_CHANGES, changes, 'Changes'],
    ['accepted', ICON_CHECK, accepted, 'Accepted'],
    ['partial', ICON_PARTIAL, partial, 'Partial'],
    ['rejected', ICON_X, rejected, 'Rejected'],
  ];
  for (const [cls, icon, num, lbl] of tiles) {
    const tile = el('div', 'stat ' + cls);
    tile.innerHTML = '<div><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'
      + '<div class="badge">' + icon + '</div>';
    wrap.appendChild(tile);
  }
  return wrap;
}

// Derive a file's overall status from its hunks, using the same accepted/
// rejected comparison as buildStats(): a file is 'accepted' when nothing is
// rejected, 'rejected' when every change is rejected, else 'pending' (mixed).
function getFileStatus(f) {
  let anyRej = false, allRej = true;
  for (const h of f.hunks) {
    const s = lineRej[h.id].size, total = changedIdx[h.id].length;
    if (s > 0) anyRej = true;
    if (!(s === total && total > 0)) allRej = false;
  }
  if (!anyRej) return 'accepted';
  if (allRej) return 'rejected';
  return 'partial';
}

// Whether a file passes the current search text AND the active status filter.
function fileMatches(f) {
  const q = fileSearch.trim().toLowerCase();
  if (q && !f.filePath.toLowerCase().includes(q)) return false;
  switch (fileFilter) {
    case 'viewed': return viewedFiles.has(f.filePath);
    case 'unviewed': return !viewedFiles.has(f.filePath);
    case 'accepted': case 'partial': case 'rejected': return getFileStatus(f) === fileFilter;
    default: return true; // 'all'
  }
}

const FILTER_OPTS = [
  ['all', 'All'], ['accepted', 'Accepted'], ['partial', 'Partial'], ['rejected', 'Rejected'],
  ['viewed', 'Viewed'], ['unviewed', 'Unviewed'],
];

// Rebuild just the file rows (not the header), so typing in the search box
// never recreates — and thus never blurs — the input element.
function renderFileList(sidebar) {
  const list = sidebar.querySelector('.sfile-list');
  const matches = model.files.map((f, i) => [f, i]).filter(([f]) => fileMatches(f));
  list.innerHTML = '';
  const count = sidebar.querySelector('.sfile-count');
  if (count) count.textContent = matches.length;

  if (matches.length === 0) {
    const empty = el('div', 'sfile-empty');
    empty.textContent = 'No files match';
    list.appendChild(empty);
    return;
  }

  for (const [f, i] of matches) {
    const { name, dir } = splitPath(f.filePath);
    const row = el('div', 'sfile' + (i === currentFileIndex ? ' current' : ''));
    const isViewed = viewedFiles.has(f.filePath);
    row.innerHTML = '<span class="sfile-icon ' + (isViewed ? 'viewed' : 'pending') + '">' + (isViewed ? ICON_CHECK_SM : '') + '</span>'
      + '<span class="sfile-info"><div class="sfile-name">' + esc(name) + '</div>'
      + (dir ? '<div class="sfile-dir">' + esc(dir) + '</div>' : '') + '</span>';
    row.onclick = () => goToFile(i);
    list.appendChild(row);
  }
}

function buildSidebar() {

    + '</div>'

  // Search input — value seeded from state so it survives sidebar rebuilds
  // (goToFile / renderAll / live refresh); oninput re-renders rows only.
  const search = head.querySelector('.sf-search input');

  search.value = fileSearch;
  clearBtn.hidden = !fileSearch;
  search.oninput = () => {
    fileSearch = search.value;

  };
  clearBtn.onclick = () => {
    fileSearch = '';

  // Filter dropdown — single-select; the active option shows a check.
  const dd = head.querySelector('.filter-dd');

  ddBtn.classList.toggle('active', fileFilter !== 'all');
  for (const item of ddMenu.querySelectorAll('.filter-dd-item')) {
    item.classList.toggle('selected', item.dataset.value === fileFilter);
    item.setAttribute('aria-selected', String(item.dataset.value === fileFilter));
    item.onclick = () => {
      fileFilter = item.dataset.value;
      for (const it of ddMenu.querySelectorAll('.filter-dd-item')) {
        it.classList.toggle('selected', it === item);
        it.setAttribute('aria-selected', String(it === item));
      }

    };

  ddBtn.onclick = () => {
    const open = ddMenu.classList.toggle('open');
    ddBtn.setAttribute('aria-expanded', String(open));
  };
  dd._closeMenu = () => { ddMenu.classList.remove('open'); ddBtn.setAttribute('aria-expanded', 'false'); };

  renderFileList(aside);
  return aside;
}

function goToFile(index) {
  if (index === currentFileIndex || index < 0 || index >= model.files.length) return;
  currentFileIndex = index;
  const main = document.getElementById('main');
  const oldDetail = main.querySelector('.detail');
  let rebuilt = false;
  const rebuild = () => {
    if (rebuilt) return; // whichever of animationend / the fallback timeout fires first wins — never both
    rebuilt = true;
    const layout = main.querySelector('.layout');
    const newDetail = buildDetail(model.files[currentFileIndex]);
    newDetail.classList.add('slide-in');
    if (oldDetail) layout.replaceChild(newDetail, oldDetail); else layout.appendChild(newDetail);
    for (const h of model.files[currentFileIndex].hunks) paintHunk(h);
    // Sidebar's "current" highlight needs updating too, cheaper to
    // rebuild it than diff which row changed.
    const newSidebar = buildSidebar();
    layout.replaceChild(newSidebar, layout.querySelector('.sidebar'));
    // Scroll the selected row into view within the sidebar list.
    const cur = newSidebar.querySelector('.sfile.current');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  };
  if (oldDetail) {
    oldDetail.classList.add('slide-out');
    oldDetail.addEventListener('animationend', rebuild, { once: true });
    // Fallback: if the animation is interrupted, skipped (reduced-motion
    // settings, some environments don't fire animationend reliably), or
    // never starts for any reason, navigation must still complete rather
    // than silently hang forever waiting for an event that never comes.
    setTimeout(rebuild, 250);
  } else {
    rebuild();
  }
}

function buildDetail(f) {
  const detail = el('div', 'detail');
  const { name, dir } = splitPath(f.filePath);
  const head = el('div', 'dhead');
  head.innerHTML = '<span class="ficon">' + ICON_FILE + '</span>'
    + '<span class="fmeta"><div class="fname">' + esc(name) + '</div>'
    + (dir ? '<div class="fdir">' + esc(dir) + '</div>' : '') + '</span>'
    + '<button class="copy-path" aria-label="Copy file path" title="Copy file path">'
      + '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="14" rx="2"/><path d="M8 8V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-4"/></svg></button>';
  head.querySelector('.copy-path').onclick = (e) => copyFilePath(f.filePath, e.currentTarget);
  detail.appendChild(head);

  const dstats = el('div', 'dstats');
  dstats.innerHTML = '<span class="plus">+' + f.additions + '</span>'
    + '<span class="minus">\u2212' + f.deletions + '</span>'
    + '<span class="fileacts"><button class="btn-accept" data-f="acc">\u2713 Accept</button>'
    + '<button class="btn-reject" data-f="rej">\u2717 Reject</button>'
    + '<label class="viewed-toggle"><input type="checkbox" data-f="viewed"' + (viewedFiles.has(f.filePath) ? ' checked' : '') + '> Viewed</label></span>';
  dstats.querySelector('[data-f="acc"]').onclick = () => { for (const h of f.hunks) setHunk(h, false); };
  dstats.querySelector('[data-f="rej"]').onclick = () => { for (const h of f.hunks) setHunk(h, true); };
  dstats.querySelector('[data-f="viewed"]').onchange = (e) => {
    if (e.target.checked) markViewed(f);
    else { viewedFiles.delete(f.filePath); renderAll(); } // unchecking is a correction — stay put, don't navigate away
  };
  detail.appendChild(dstats);

  let hunkNum = 0;
  for (const h of f.hunks) {
    hunkNum++;
    const hunkEl = el('div', 'hunk' + (collapsedHunks.has(h.id) ? ' collapsed' : ''));
    hunkEl.id = h.id;
    const bar = el('div', 'hunkbar');
    const showHunkActs = f.hunks.length > 1; // single-hunk files: file-level buttons already cover it
    bar.innerHTML = '<span class="hunk-toggle" role="button" tabindex="0" aria-label="Collapse hunk">'
      + '<span class="hunk-chev">' + ICON_CHEV + '</span>'
      + '<span class="hunk-title">Hunk ' + hunkNum + '</span>'
      + '<span class="hunk-range">' + hunkRangeLabel(h) + '</span>'
      + '<span class="st"></span></span>'
      + (showHunkActs
          ? '<span class="acts"><button class="btn-accept" data-a="acc">\u2713 Accept</button>'
            + '<button class="btn-reject" data-a="rej">\u2717 Reject</button></span>'
          : '');
    bar.querySelector('.hunk-toggle').onclick = () => toggleHunkCollapse(h);
    if (showHunkActs) {
      bar.querySelector('[data-a="acc"]').onclick = () => setHunk(h, false);
      bar.querySelector('[data-a="rej"]').onclick = () => setHunk(h, true);
    }
    hunkEl.appendChild(bar);

    const pre = el('pre');
    let oldLn = h.oldStart != null ? h.oldStart : 1;
    let newLn = h.newStart != null ? h.newStart : 1;
    let i = 0;
    while (i < h.lines.length) {
      const l = h.lines[i];
      const changed = (l[0] === '+' || l[0] === '-') && !l.startsWith('\\');
      if (!changed) {
        pre.appendChild(lineSpan(h, i, false, oldLn, newLn));
        if (!l.startsWith('\\')) { oldLn++; newLn++; }
        i++;
        continue;
      }
      const seg = el('div', 'seg');
      const segIdx = [];
      while (i < h.lines.length && (h.lines[i][0] === '+' || h.lines[i][0] === '-' || h.lines[i].startsWith('\\'))) {
        if (!h.lines[i].startsWith('\\')) {
          const isAdd = h.lines[i][0] === '+';
          seg.appendChild(lineSpan(h, i, true, isAdd ? null : oldLn, isAdd ? newLn : null));
          segIdx.push(i);
          if (isAdd) newLn++; else oldLn++;
        }
        i++;
      }
      const segbar = el('div', 'segbar');
      const keep = el('button', 'btn-accept'); keep.textContent = '\u2713 Accept';
      const rev = el('button', 'btn-reject'); rev.textContent = '\u2717 Reject';
      keep.onclick = (e) => {
        e.stopPropagation();
        const before = rejSnapshot(h);
        segIdx.forEach(x => lineRej[h.id].delete(x));
        paintHunk(h); tally();
        if (rejSnapshot(h) === before) pulseHunk(h);
      };
      rev.onclick = (e) => {
        e.stopPropagation();
        const before = rejSnapshot(h);
        segIdx.forEach(x => lineRej[h.id].add(x));
        paintHunk(h); tally();
        if (rejSnapshot(h) === before) pulseHunk(h);
      };
      segbar.appendChild(keep); segbar.appendChild(rev);
      seg.appendChild(segbar);
      pre.appendChild(seg);
    }
    hunkEl.appendChild(pre);

    const reason = el('div', 'reason');
    reason.style.display = 'none';
    renderReasonBox(h, reason);
    hunkEl.appendChild(reason);

    detail.appendChild(hunkEl);
  }
  return detail;
}

// Human-readable stand-in for the raw "@@ -a,b +c,d @@" header — most
// readers don't parse unified-diff range syntax at a glance.
function hunkRangeLabel(h) {
  const start = h.newStart != null ? h.newStart : 1;
  const span = Math.max(h.additions || 0, h.deletions || 0, 1);
  return 'Lines ' + start + '\u2013' + (start + span - 1);
}

function markViewed(f) {
  viewedFiles.add(f.filePath);
  // Advance to the next file that hasn't been viewed yet, wrapping
  // around past the end — not just the next index — so reviewing out
  // of order (skip one, come back to it later) naturally lands you
  // back on whatever's still unread instead of leaving you stuck at
  // the end with an unread file sitting behind you.
  for (let step = 1; step <= model.files.length; step++) {
    const idx = (currentFileIndex + step) % model.files.length;
    if (!viewedFiles.has(model.files[idx].filePath)) { goToFile(idx); return; }
  }
  renderAll(); // everything is viewed — nowhere unread to go, just refresh the sidebar's checkmark
}

function rejSnapshot(h) {
  return [...lineRej[h.id]].sort((a, b) => a - b).join(',');
}

function toggleLine(h, i) {
  const before = rejSnapshot(h);
  const s = lineRej[h.id];
  s.has(i) ? s.delete(i) : s.add(i);
  paintHunk(h); tally();
  if (rejSnapshot(h) === before) pulseHunk(h);
}

function setHunk(h, rejectAll) {
  const before = rejSnapshot(h);
  lineRej[h.id] = rejectAll ? new Set(changedIdx[h.id]) : new Set();
  paintHunk(h); tally();
  if (rejSnapshot(h) === before) pulseHunk(h);
}

function toggleHunkCollapse(h) {
  if (collapsedHunks.has(h.id)) collapsedHunks.delete(h.id);
  else collapsedHunks.add(h.id);
  const hunkEl = document.getElementById(h.id);
  if (hunkEl) hunkEl.classList.toggle('collapsed', collapsedHunks.has(h.id));
}

// Confirms a click registered ONLY when it didn't change anything
// (e.g. clicking Accept on something already accepted by default) —
// a genuine transition already has its own color-change feedback, so
// pulsing on top of that reads as unnecessary jerk, not confirmation.
function pulseHunk(h) {
  const el = document.getElementById(h.id);
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth; // force reflow so back-to-back no-op clicks each re-trigger the animation
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 500);
}

function copyFilePath(filePath, btn) {
  const original = btn.innerHTML;
  const doneIcon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  const showDone = () => {
    btn.innerHTML = doneIcon;
    btn.title = 'Copied!';
    setTimeout(() => { btn.innerHTML = original; btn.title = 'Copy file path'; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(filePath).then(showDone).catch(() => fallbackCopy(filePath, showDone));
  } else {
    fallbackCopy(filePath, showDone);
  }
}

function fallbackCopy(text, then) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  then();
}

// Renders a hunk's reason box in one of two modes: an editable input
// (default, or after clicking Edit), or a confirmed read-only view with
// Edit/Delete once Enter has been pressed. Enter NEVER triggers Apply
// review or any page-level submission — it only confirms this one field.
function renderReasonBox(h, reasonDiv) {
  reasonDiv.innerHTML = '';
  if (reasonConfirmed[h.id] && reasons[h.id]) {
    const view = el('div', 'reason-view');
    const txt = el('span', 'txt');
    txt.textContent = reasons[h.id];
    txt.title = reasons[h.id];
    const editBtn = document.createElement('button');
    editBtn.textContent = '\u270e Edit';
    editBtn.onclick = () => { reasonConfirmed[h.id] = false; renderReasonBox(h, reasonDiv); };
    const delBtn = document.createElement('button');
    delBtn.textContent = '\u2715 Delete';
    delBtn.onclick = () => { reasons[h.id] = ''; reasonConfirmed[h.id] = false; renderReasonBox(h, reasonDiv); };
    view.appendChild(txt); view.appendChild(editBtn); view.appendChild(delBtn);
    reasonDiv.appendChild(view);
  } else {
    const row = el('div', 'reason-row');
    const inp = document.createElement('input');
    inp.placeholder = 'Why? This goes back to Claude as feedback (optional)';
    inp.value = reasons[h.id] || '';
    const submitBtn = document.createElement('button');
    submitBtn.className = 'reason-submit';
    submitBtn.type = 'button';
    submitBtn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    submitBtn.title = 'Submit reason (or press Enter)';
    submitBtn.disabled = !inp.value.trim();

    // Shared by both the Enter key and the button click, so clicking
    // does exactly what pressing Enter already does — one path, not two.
    const confirm = () => {
      if (!inp.value.trim()) { inp.blur(); return; }
      reasonConfirmed[h.id] = true;
      renderReasonBox(h, reasonDiv);
    };

    inp.oninput = () => {
      reasons[h.id] = inp.value;
      submitBtn.disabled = !inp.value.trim();
    };
    inp.onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault(); // never let Enter bubble into a page-level submit/Apply action
      confirm();
    };
    submitBtn.onclick = confirm;

    row.appendChild(inp);
    row.appendChild(submitBtn);
    reasonDiv.appendChild(row);
  }
}

function paintHunk(h) {
  const hunkEl = document.getElementById(h.id);
  if (!hunkEl) return; // hunk belongs to a file not currently in the detail pane
  const s = lineRej[h.id], total = changedIdx[h.id].length;
  hunkEl.querySelectorAll('pre .l').forEach(sp => {
    if (sp.dataset.i === undefined) return;
    const flagged = s.has(+sp.dataset.i);
    // A rejected '+' line is being undone (struck through). A rejected
    // '-' line is being RESTORED — the opposite outcome — so it must
    // look kept, not crossed out, or it reads as "both sides erased."
    sp.classList.toggle('rej', flagged && sp.classList.contains('a'));
    sp.classList.toggle('restoring', flagged && sp.classList.contains('d'));
  });
  const state = s.size === 0 ? 'accepted' : s.size === total ? 'rejected' : 'partial';
  hunkEl.className = 'hunk ' + state + (collapsedHunks.has(h.id) ? ' collapsed' : '');
  hunkEl.querySelector('.st').textContent =
    state === 'accepted' ? '' : state === 'rejected' ? 'rejected' : s.size + ' of ' + total + ' lines reverting';
  const reasonDiv = hunkEl.querySelector('.reason');
  reasonDiv.style.display = s.size ? '' : 'none';
  if (s.size === 0 && (reasons[h.id] || reasonConfirmed[h.id])) {
    // Accepting invalidates any reason attached to a PRIOR rejection —
    // without this, re-rejecting the same hunk later would silently
    // resurface old text the user never reconfirmed this time, and it
    // could reach Claude as feedback despite the user having moved on.
    reasons[h.id] = '';
    reasonConfirmed[h.id] = false;
    renderReasonBox(h, reasonDiv);
  }
}

function tally() {
  let total = 0, rej = 0, partial = 0;
  for (const id in changedIdx) {
    total++;
    const s = lineRej[id].size;
    if (s === changedIdx[id].length && s > 0) rej++;
    else if (s > 0) partial++;
  }
  const statsEl = document.querySelector('.stats');
  if (statsEl) { statsEl.replaceWith(buildStats()); }
  const sidebar = document.querySelector('.sidebar');
  if (sidebar) renderFileList(sidebar);
}

function showApplyConfirm() {
  let totalFiles = model.files.length, accepted = 0, partial = 0, rejected = 0;
  for (const f of model.files) for (const h of f.hunks) {
    const s = lineRej[h.id].size, total = changedIdx[h.id].length;
    if (s === total && total > 0) rejected++;
    else if (s === 0) accepted++;
    else partial++;
  }
  const summary = document.getElementById('confirmSummary');
  summary.innerHTML =
    '<div class="cs-tile cs-files"><div class="cs-num">' + totalFiles + '</div><div class="cs-lbl">Files</div></div>' +
    '<div class="cs-tile cs-accepted"><div class="cs-num">' + accepted + '</div><div class="cs-lbl">Accepted</div></div>' +
    '<div class="cs-tile cs-partial"><div class="cs-num">' + partial + '</div><div class="cs-lbl">Partial</div></div>' +
    '<div class="cs-tile cs-rejected"><div class="cs-num">' + rejected + '</div><div class="cs-lbl">Rejected</div></div>';

  const fileWord = totalFiles === 1 ? 'file' : 'files';
  let msg;
  if (rejected === 0 && partial === 0) {
    msg = 'All changes across <strong>' + totalFiles + ' ' + fileWord + '</strong> will be kept.';
  } else if (accepted === 0 && partial === 0) {
    msg = 'All <strong>' + rejected + ' change' + (rejected === 1 ? '' : 's') + '</strong> across <strong>' + totalFiles + ' ' + fileWord + '</strong> will be reverted.';
  } else {
    const parts = [];
    if (accepted > 0) parts.push('<strong>' + accepted + ' change' + (accepted === 1 ? '' : 's') + '</strong> kept');
    if (partial > 0) parts.push('<strong>' + partial + '</strong> partially reverted');
    if (rejected > 0) parts.push('<strong>' + rejected + '</strong> fully reverted');
    msg = parts.join(', ') + ' across <strong>' + totalFiles + ' ' + fileWord + '</strong>.';
  }
  document.getElementById('confirmMsg').innerHTML = msg;
  document.getElementById('confirmOverlay').classList.remove('hidden');
  document.getElementById('confirmOk').focus();
}

async function submit() {
  document.getElementById('confirmOverlay').classList.add('hidden');
  if (pollTimer) clearInterval(pollTimer);
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = 'Applying\u2026';
  const selections = {};
  let count = 0;
  for (const id in lineRej) {
    if (lineRej[id].size) { selections[id] = { lines: [...lineRej[id]] }; count++; }
  }
  const res = await fetch('/api/submit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ selections, reasons })
  });
  const out = await res.json();
  const fails = (out.results || []).filter(r => !r.ok);
  btn.textContent = 'Applied ✓';
  document.getElementById('acceptAll').style.display = 'none';
  document.getElementById('rejectAll').style.display = 'none';
  document.getElementById('main').innerHTML = '<div class="done"><h2>Review applied</h2>'
    + '<p>Accepted changes kept. Rejected lines in ' + count + ' hunk(s) reverted.</p>'
    + (fails.length ? '<p class="fail">Could not revert: '
        + fails.map(x => esc(x.file)).join(', ') + ' \u2014 file changed since the diff; revert via git.</p>' : '')
    + '<p style="color:var(--dim)">Feedback saved to .claude-review/feedback.md. This tab will try to close itself in a moment \u2014 if your browser blocks that, you can close it yourself.</p></div>';

  // Best-effort auto-close. Browsers only let a script close a tab it
  // opened itself via window.open() — these tabs are launched by the
  // OS opening the default browser instead, which most browsers treat
  // as NOT script-opened, so this can silently do nothing depending on
  // the browser. Harmless to attempt regardless, and it means the tab
  // genuinely closing (rather than lingering in an ambiguous "maybe
  // still open" state) is what the next review can rely on, instead
  // of only a polling-based guess.
  setTimeout(() => { window.close(); }, 900);
}

function lineSpan(h, i, clickable, oldLn, newLn) {
  const l = h.lines[i];
  const cls = l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : 'c';
  const span = el('span', 'l ' + cls);
  const gutter = el('span', 'gutter');
  gutter.innerHTML = '<span>' + (oldLn != null ? oldLn : '') + '</span><span>' + (newLn != null ? newLn : '') + '</span>';
  span.appendChild(gutter);
  const txt = el('span', 'txt');
  txt.textContent = l || ' ';
  span.appendChild(txt);
  if (clickable) {
    span.title = 'Click to reject just this line';
    span.onclick = () => toggleLine(h, i);
    span.dataset.i = i;
  }
  return span;
}

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('acceptAll').onclick = () => { for (const f of model.files) for (const h of f.hunks) setHunk(h, false); };
document.getElementById('rejectAll').onclick = () => { for (const f of model.files) for (const h of f.hunks) setHunk(h, true); };
document.getElementById('submit').onclick = showApplyConfirm;
document.getElementById('confirmOk').onclick = submit;
document.getElementById('confirmCancel').onclick = () => document.getElementById('confirmOverlay').classList.add('hidden');
document.getElementById('confirmOverlay').onclick = (e) => { if (e.target === e.currentTarget) document.getElementById('confirmOverlay').classList.add('hidden'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('confirmOverlay').classList.add('hidden'); });
load();
</script>
</body>
</html>
